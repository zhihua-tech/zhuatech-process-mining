uted">从事件序列生成实际流程模型和关键</text></g><g transform="translate(320,400)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">VARIANT</text><text x="20" y="70" class="title">流程变体</text><text x="20" y="96" class="muted">识别主路径、长尾路径和异常高频变</text></g><g transform="translate(590,400)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">CONFORMANCE</text><text x="20" y="70" class="title">一致性检查</text><text x="20" y="96" class="muted">将真实路径与标准流程对比并定位偏</text></g><g transform="translate(860,400)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">BOTTLENECK</text><text x="20" y="70" class="title">瓶颈分析</text><text x="20" y="96" class="muted">分析等待、交接、拥塞和周期时间损</text></g><text x="320" y="655" class="sub">界面示意 · 上海如静知华信息科技有限公司 · https://www.zhuatech.cn/</text></svg>